<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片轉 Markdown / Excel 工具</title>
    <!-- 引入 Marked.js 用於渲染 Markdown 表格 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .api-config {
            background: #eef5fc;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .api-config input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .drop-zone {
            border: 2px dashed var(--primary-color);
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            background: #fafcfe;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 20px;
        }

        .drop-zone:hover {
            background: #eaf2fb;
        }

        .preview-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .preview-box {
            flex: 1;
            min-width: 300px;
            max-height: 400px;
            overflow: hidden;
            border: 1px solid #ddd;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eee;
        }

        .preview-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .output-box {
            flex: 1;
            min-width: 300px;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: monospace;
            resize: vertical;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #357abd;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .rendered-html {
            margin-top: 20px;
            border-top: 2px solid #eee;
            padding-top: 20px;
            overflow-x: auto;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        .loading {
            display: none;
            color: var(--primary-color);
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>圖片辨識轉 Markdown 表格</h1>

    <div class="api-config">
        <label for="apiKey"><strong>Gemini API Key：</strong></label>
        <input type="password" id="apiKey" placeholder="請貼上您的 Google Gemini API Key">
        <small><a href="https://aistudio.google.com/app/apikey" target="_blank">取得免費Key</a></small>
    </div>

    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <p>點擊上傳圖片，或直接將圖片拖曳至此處</p>
        <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFile(this.files[0])">
    </div>

    <div class="preview-container">
        <div class="preview-box">
            <img id="imagePreview" src="" alt="圖片預覽" style="display: none;">
            <span id="previewText">尚未上傳圖片</span>
        </div>
        <div class="output-box">
            <label><strong>Markdown 輸出結果：</strong></label>
            <textarea id="markdownOutput" placeholder="辨識結果將顯示於此..."></textarea>
            <div class="actions">
                <button onclick="copyMarkdown()">複製 Markdown</button>
            </div>
        </div>
    </div>

    <button id="processBtn" style="width: 100%;" onclick="processImage()" disabled>開始辨識提取表格</button>
    <div class="loading" id="loadingText">⏳ AI 正在辨識提取資料中，請稍候...</div>

    <div class="rendered-html">
        <h3>表格預覽：</h3>
        <div id="tableRender"></div>
    </div>
</div>

<script>
    let base64Image = "";

    // 拖曳上傳處理
    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover', (e) => e.preventDefault());
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        if (e.dataTransfer.files.length) {
            handleFile(e.dataTransfer.files[0]);
        }
    });

    function handleFile(file) {
        if (!file || !file.type.startsWith('image/')) {
            alert('請上傳有效的圖片檔案');
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            base64Image = e.target.result.split(',')[1];
            const img = document.getElementById('imagePreview');
            img.src = e.target.result;
            img.style.display = 'block';
            document.getElementById('previewText').style.display = 'none';
            document.getElementById('processBtn').disabled = false;
        };
        reader.readAsDataURL(file);
    }

    async function processImage() {
        const apiKey = document.getElementById('apiKey').value.trim();
        if (!apiKey) {
            alert('請先填寫 Google Gemini API Key');
            return;
        }

        const processBtn = document.getElementById('processBtn');
        const loadingText = document.getElementById('loadingText');
        
        processBtn.disabled = true;
        loadingText.style.display = 'block';

        const prompt = "請辨識這張圖片中的所有表格資料，並嚴格將其提取轉換為標準的 Markdown 表格格式輸出。不需要其他多餘的解釋或開場白，直接輸出 Markdown 表格與其附註文字即可。";

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: prompt },
                            { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                        ]
                    }]
                })
            });

            const data = await response.json();
            
            if (data.error) {
                alert('API 錯誤: ' + data.error.message);
            } else {
                const textResult = data.candidates[0].content.parts[0].text;
                document.getElementById('markdownOutput').value = textResult;
                document.getElementById('tableRender').innerHTML = marked.parse(textResult);
            }
        } catch (error) {
            alert('請求失敗：' + error.message);
        } finally {
            processBtn.disabled = false;
            loadingText.style.display = 'none';
        }
    }

    function copyMarkdown() {
        const text = document.getElementById('markdownOutput').value;
        if (!text) return;
        navigator.clipboard.writeText(text);
        alert('已複製 Markdown 至剪貼簿！');
    }
</script>

</body>
</html>
