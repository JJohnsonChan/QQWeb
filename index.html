<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片辨識轉 Excel 工具</title>
    <!-- 引入 SheetJS (XLSX) 用於直接產生與下載 .xlsx 檔案 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #1f7244; /* Excel 綠 */
            --primary-hover: #154c2e;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .api-config {
            background: #eef5fc;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .api-config input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .drop-zone {
            border: 2px dashed var(--primary-color);
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            background: #f0fdf4;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 20px;
        }

        .drop-zone:hover {
            background: #dcceeb;
            background-color: #e2f7e9;
        }

        .preview-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .preview-box {
            flex: 1;
            min-width: 300px;
            max-height: 350px;
            overflow: hidden;
            border: 1px solid #ddd;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eee;
        }

        .preview-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .download-btn {
            background-color: #107c41;
            display: none;
        }

        .download-btn:hover {
            background-color: #0b592e;
        }

        .rendered-html {
            margin-top: 25px;
            border-top: 2px solid #eee;
            padding-top: 20px;
            overflow-x: auto;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px 10px;
            text-align: center;
        }

        th {
            background-color: #e2efda;
            color: #276a3c;
            font-weight: bold;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .loading {
            display: none;
            color: var(--primary-color);
            font-weight: bold;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📷 圖片辨識直接轉 Excel (.xlsx)</h1>

    <div class="api-config">
        <label for="apiKey"><strong>Gemini API Key：</strong></label>
        <input type="password" id="apiKey" placeholder="請貼上您的 Google Gemini API Key">
        <small><a href="https://aistudio.google.com/app/apikey" target="_blank">取得免費 Key</a></small>
    </div>

    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <p>點擊上傳圖片，或直接將圖片拖曳至此處</p>
        <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFile(this.files[0])">
    </div>

    <div class="preview-container">
        <div class="preview-box">
            <img id="imagePreview" src="" alt="圖片預覽" style="display: none;">
            <span id="previewText">尚未上傳圖片</span>
        </div>
    </div>

    <button id="processBtn" style="width: 100%;" onclick="processImage()" disabled>開始辨識並提取表格</button>
    <div class="loading" id="loadingText">⏳ AI 辨識中，請稍候...</div>

    <div class="rendered-html">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>表格預覽：</h3>
            <button id="downloadBtn" class="download-btn" onclick="downloadExcel()">📥 下載 Excel (.xlsx)</button>
        </div>
        <div id="tableRender"></div>
    </div>
</div>

<script>
    let base64Image = "";
    let extractedData = []; // 存放提取出的二維陣列資料

    // 拖曳上傳處理
    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover', (e) => e.preventDefault());
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        if (e.dataTransfer.files.length) {
            handleFile(e.dataTransfer.files[0]);
        }
    });

    function handleFile(file) {
        if (!file || !file.type.startsWith('image/')) {
            alert('請上傳有效的圖片檔案');
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            base64Image = e.target.result.split(',')[1];
            const img = document.getElementById('imagePreview');
            img.src = e.target.result;
            img.style.display = 'block';
            document.getElementById('previewText').style.display = 'none';
            document.getElementById('processBtn').disabled = false;
        };
        reader.readAsDataURL(file);
    }

    async function processImage() {
        const apiKey = document.getElementById('apiKey').value.trim();
        if (!apiKey) {
            alert('請先填寫 Google API Key');
            return;
        }

        const processBtn = document.getElementById('processBtn');
        const loadingText = document.getElementById('loadingText');
        const downloadBtn = document.getElementById('downloadBtn');
        
        processBtn.disabled = true;
        loadingText.style.display = 'block';
        downloadBtn.style.display = 'none';

        // 提示 AI 直接回傳 JSON 陣列格式
        const prompt = `請辨識圖片中的所有表格資料。請將表格內容嚴格轉換為 JSON 二維陣列格式（Array of Arrays）輸出。
格式範例：
[
  ["日期", "姓名", "班別"],
  ["1", "張三", "1345-2215"],
  ["2", "李四", "休"]
]
請只輸出純 JSON 字串，不要包含任何 markdown 標記（如 \`\`\`json ）。`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: prompt },
                            { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                        ]
                    }]
                })
            });

            const data = await response.json();
            
            if (data.error) {
                alert('API 錯誤: ' + data.error.message);
            } else {
                let textResult = data.candidates[0].content.parts[0].text.trim();
                // 清理可能的 Markdown 標記
                textResult = textResult.replace(/^```json/g, '').replace(/^```/g, '').replace(/```$/g, '').trim();
                
                extractedData = JSON.parse(textResult);
                
                // 渲染預覽 HTML 表格
                renderTable(extractedData);
                downloadBtn.style.display = 'inline-block';
            }
        } catch (error) {
            alert('辨識或解析失敗：' + error.message + '\n請確認圖片是否有清晰表格資料。');
        } finally {
            processBtn.disabled = false;
            loadingText.style.display = 'none';
        }
    }

    // 將資料繪製為網頁預覽表格
    function renderTable(data) {
        if (!data || data.length === 0) return;

        let html = '<table>';
        data.forEach((row, rowIndex) => {
            html += '<tr>';
            row.forEach(cell => {
                if (rowIndex === 0) {
                    html += `<th>${cell}</th>`;
                } else {
                    html += `<td>${cell}</td>`;
                }
            });
            html += '</tr>';
        });
        html += '</table>';

        document.getElementById('tableRender').innerHTML = html;
    }

    // 觸發下載 Excel 檔案 (.xlsx)
    function downloadExcel() {
        if (!extractedData || extractedData.length === 0) return;

        // 建立 SheetJS 工作表與工作簿
        const worksheet = XLSX.utils.aoa_to_sheet(extractedData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Sheet1");

        // 自動匯出為 .xlsx 檔
        XLSX.writeFile(workbook, "提取資料表.xlsx");
    }
</script>

</body>
</html>
